name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Test, Verify & Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run architecture & script verification
        run: python3 scripts/verify_project.py

      - name: Secret hygiene check
        run: |
          if git ls-files keystore.properties '*.jks' '*.keystore' | grep -q .; then
            echo "ERROR: Signing secrets must never be tracked in git!"
            exit 1
          fi

      - name: Run unit tests and build APKs
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease

      - name: Enforce release APK size constraint (< 10 MB)
        run: |
          APK_FILE=$(ls app/build/outputs/apk/release/LiveSport77-v*-release*.apk | head -n 1)
          SIZE_BYTES=$(stat -c%s "$APK_FILE")
          MAX_BYTES=$((10 * 1024 * 1024))
          echo "Release APK: $APK_FILE ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "ERROR: Release APK exceeds 10 MB budget from CONSTRAINTS.md"
            exit 1
          fi

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload built APKs
        uses: actions/upload-artifact@v4
        with:
          name: livesport77-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 14
